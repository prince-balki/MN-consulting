services:
  - type: web
    name: mm-consulting-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:generate && npm run build:server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CLIENT_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
